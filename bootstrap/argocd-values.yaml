# Values for the official argo-cd chart (https://argoproj.github.io/argo-helm),
# installed once by the bootstrap and then reconciled by argocd/argocd.yaml.
configs:
  params:
    # Plain HTTP; access via `kubectl port-forward` only (no public UI). If
    # exposed through Traefik later, keep this and terminate TLS at the ingress.
    server.insecure: true
  cm:
    exec.enabled: "false"
    timeout.reconciliation: 180s
    # App-of-apps: report a child Application's own health so sync-waves in
    # argocd/ actually wait (default: every Application is Healthy on creation).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  rbac:
    # Everyone but `admin` is read-only; grant more via SSO groups once an
    # identity provider is wired in (Dex stays off until then).
    policy.default: role:readonly

# Unused components off: smaller footprint, smaller attack surface.
dex:
  enabled: false
applicationSet:
  replicas: 0 # the chart has no `enabled` switch for it
notifications:
  enabled: false

# Requests/limits so the cluster autoscaler and node sizing can account for
# ArgoCD. Metrics: the chart's own Services + ServiceMonitors, scraped by the
# cluster Prometheus (charts/monitoring). The chart renders a ServiceMonitor
# only once the operator CRDs exist, so the bootstrap install skips them and
# the self-managed Application (argocd/argocd.yaml) adds them afterwards.
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # Renders kube-prometheus-stack and the operator CRD chart - multi-megabyte
  # manifests that need more than the usual headroom while helm runs.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
redis:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
