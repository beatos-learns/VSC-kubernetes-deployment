# Values for the official argo-cd chart (https://argoproj.github.io/argo-helm)
# installed once during bootstrap — see bootstrap/README.md.
configs:
  params:
    # The API server runs plain HTTP; access is via `kubectl port-forward`
    # (TLS would otherwise be terminated twice). If the dashboard is later
    # exposed through Traefik, keep this and terminate TLS at the ingress.
    server.insecure: true
  cm:
    # App-of-apps: by default ArgoCD reports every child Application as
    # Healthy the moment it exists, so the sync-wave ordering in argocd/
    # (cert-manager before its ClusterIssuer) would not wait for anything.
    # This surfaces the child's own health instead. On a running cluster the
    # change lands via `helm upgrade` (re-run Bootstrap-DoksCluster).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
