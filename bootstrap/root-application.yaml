# App-of-apps: the only Application applied by hand (once, during bootstrap).
# It syncs the argocd/ directory of this repo, which contains the AppProject,
# the ingress controller app, and the two environment apps. Everything after
# this file is pull-based GitOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/beatos-learns/VSC-kubernetes-deployment.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
