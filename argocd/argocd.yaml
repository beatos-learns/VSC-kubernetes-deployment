# ArgoCD manages itself after the bootstrap: same chart, same release name and
# the same values file the bootstrap used (bootstrap/argocd-values.yaml), so a
# values change on main upgrades ArgoCD instead of drifting from it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.4.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/bootstrap/argocd-values.yaml
    - repoURL: https://github.com/beatos-learns/VSC-kubernetes-deployment.git
      targetRevision: main
      ref: values
  destination:
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true # CRDs exceed the client-side annotation size limit
