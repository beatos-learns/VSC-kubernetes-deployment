apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: auth-stack
  source:
    repoURL: https://github.com/beatos-learns/VSC-kubernetes-deployment.git
    targetRevision: main
    path: charts/auth-stack
    helm:
      # short release name => resource names auth-db / auth-backend / auth-frontend
      releaseName: auth
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    namespace: auth-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # ServiceMonitor + PrometheusRule: the operator CRDs may arrive with
      # infra-monitoring in the same wave (argocd/infra-monitoring.yaml)
      - SkipDryRunOnMissingResource=true
    # Pod Security Admission: the namespace itself enforces the restricted
    # profile (the chart's pods comply; anything else is rejected)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
        environment: staging
