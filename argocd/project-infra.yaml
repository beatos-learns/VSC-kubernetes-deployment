# AppProject for the platform apps (Traefik, cert-manager, ClusterIssuer,
# metrics-server, kube-prometheus-stack, ArgoCD itself): explicit chart
# repositories and namespaces (kube-system for metrics-server's auth-reader
# RoleBinding and the monitoring stack's kubelet/CoreDNS Services), and only
# the cluster-scoped kinds those charts actually create.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: Cluster platform (ingress controller, certificates, metrics, monitoring, ArgoCD)
  sourceRepos:
    - https://github.com/beatos-learns/VSC-kubernetes-deployment.git
    - https://traefik.github.io/charts
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://argoproj.github.io/argo-helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: traefik
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: metrics-server
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: networking.k8s.io
      kind: IngressClass
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
