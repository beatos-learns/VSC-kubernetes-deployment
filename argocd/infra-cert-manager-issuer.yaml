# The ClusterIssuer for cert-manager (cert-manager-issuer/). Split from
# infra-cert-manager.yaml into its own Application, gated by sync-wave, so it
# only applies once the cert-manager CRDs (ClusterIssuer among them) exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-cert-manager-issuer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # `default` project: ClusterIssuer is a cluster-scoped resource.
  project: default
  source:
    repoURL: https://github.com/beatos-learns/VSC-kubernetes-deployment.git
    targetRevision: main
    path: cert-manager-issuer
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
