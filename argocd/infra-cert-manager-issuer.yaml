# ClusterIssuer chart (charts/cert-manager-issuer), applied after the CRDs:
# sync-wave -1 (the root app waits thanks to the Application health check in
# bootstrap/argocd-values.yaml) plus skip-dry-run + retry for the CRD race.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-cert-manager-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: infra
  source:
    repoURL: https://github.com/beatos-learns/VSC-kubernetes-deployment.git
    targetRevision: main
    path: charts/cert-manager-issuer
  destination:
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - SkipDryRunOnMissingResource=true
