apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: auth-stack
  source:
    repoURL: https://github.com/beatos-learns/VSC-kubernetes-deployment.git
    targetRevision: main
    path: charts/auth-stack
    helm:
      releaseName: auth
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    namespace: auth-prod
  syncPolicy:
    # Prod syncs automatically too (sync-defaults.patch) - the human gate is
    # the promotion PR into values-prod.yaml, not a manual sync button.
    syncOptions:
      - CreateNamespace=true
      # ServiceMonitor + PrometheusRule: the operator CRDs may arrive with
      # infra-monitoring in the same wave (argocd/infra-monitoring.yaml)
      - SkipDryRunOnMissingResource=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
        environment: production
