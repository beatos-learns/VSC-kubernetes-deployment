# Cluster-wide Traefik ingress controller (official chart, MIT license,
# Traefik Labs). Replaces the in-stack proxy component of generic-stack:
# one DigitalOcean load balancer shared by all environments.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # `default` project: an ingress controller needs cluster-scoped
  # resources (CRDs, ClusterRole, IngressClass) — see argocd/project.yaml.
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.2.0
    helm:
      valuesObject:
        ingressClass:
          enabled: true
          isDefaultClass: true
        service:
          type: LoadBalancer
        # Traefik must be reachable from the app namespaces' default-deny
        # posture only in the ingress direction; no special values needed.
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs exceed the client-side annotation size limit
