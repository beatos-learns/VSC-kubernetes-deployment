# Cluster-wide Traefik ingress controller (official chart, MIT, Traefik Labs).
# Replaces the in-stack proxy component: one DO load balancer for all
# environments. No finalizer: deleting this Application must never take the
# load balancer down as a side effect.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-traefik
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.2.0
    helm:
      valuesObject:
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ingressClass:
          enabled: true
          isDefaultClass: true
          name: traefik # referenced by ingress.className in the app values
        service:
          type: LoadBalancer
          spec:
            externalTrafficPolicy: Local # nodes drain cleanly; client IPs preserved
        tlsOptions:
          default:
            minVersion: VersionTLS12
        api:
          dashboard: false # enable ad hoc + `kubectl -n traefik port-forward deploy/infra-traefik 8081:8080`
        ingressRoute:
          dashboard:
            enabled: false
        log:
          level: INFO
          format: json
        accessLog:
          enabled: true
          format: json
        # Scraped by the cluster Prometheus (charts/monitoring): a metrics
        # Service on the metrics entry point (never on the load balancer) and
        # the chart's own ServiceMonitor, so labels and port stay the chart's.
        metrics:
          prometheus:
            addRoutersLabels: true # per Ingress host = per environment
            buckets: "0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5"
            service:
              enabled: true
            serviceMonitor:
              enabled: true
              jobLabel: app.kubernetes.io/name # job="traefik"
              # Traefik labels its series by service and entry point; without this
              # the target's own `service` label would rename them to exported_service
              honorLabels: true
            # the chart's CRD check reads API discovery, which lags the CRD
            # install (infra-monitoring-crds.yaml) by a cache refresh
            disableAPICheck: true
        ports:
          web:
            # HTTP-01 keeps working: Let's Encrypt follows the redirect to HTTPS
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
  destination:
    namespace: traefik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs exceed the client-side annotation size limit
