# Cluster-wide Traefik ingress controller (official chart, MIT license,
# Traefik Labs). Replaces the in-stack proxy component of generic-stack:
# one DigitalOcean load balancer shared by all environments.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # `default` project: an ingress controller needs cluster-scoped
  # resources (CRDs, ClusterRole, IngressClass) — see argocd/project.yaml.
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.2.0
    helm:
      valuesObject:
        ingressClass:
          enabled: true
          isDefaultClass: true
          # Pinned so auth-stack's `ingress.className: traefik` (charts/auth-stack/values.yaml)
          # resolves — without this it defaults to the Helm release fullname
          # (`infra-traefik`), which the app Ingresses don't reference.
          name: traefik
        service:
          type: LoadBalancer
        # Traefik must be reachable from the app namespaces' default-deny
        # posture only in the ingress direction; no special values needed.
        ingressRoute:
          dashboard:
            # Binds api@internal/dashboard@internal to the `traefik`
            # entryPoint (:8080). That port is intentionally NOT in the
            # LoadBalancer Service, so the dashboard is only reachable via
            # `kubectl -n traefik port-forward deploy/infra-traefik 8081:8080`
            # (http://localhost:8081/dashboard/), never from the internet.
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs exceed the client-side annotation size limit
