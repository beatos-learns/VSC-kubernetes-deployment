# AppProject for the environment apps. Strict on purpose: only this repo as
# source, only the two env namespaces, the Namespace itself as the only
# cluster-scoped kind (CreateNamespace + managed PSA labels), and only the
# namespaced kinds the auth-stack chart renders (no RBAC, no Secrets -
# secrets are created out-of-band, see bootstrap/README.md).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: auth-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: Auth stack environments (staging + production)
  sourceRepos:
    - https://github.com/beatos-learns/VSC-kubernetes-deployment.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: auth-staging
    - server: https://kubernetes.default.svc
      namespace: auth-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: batch
      kind: CronJob
    - group: batch
      kind: Job
    - group: traefik.io
      kind: Middleware
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
