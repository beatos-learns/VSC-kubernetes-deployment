# Observability platform (Aufgabe 7): kube-prometheus-stack via the wrapper
# chart charts/monitoring, whose values.yaml is the declarative configuration
# of the whole stack. Its CRDs arrive separately and earlier
# (infra-monitoring-crds.yaml, wave -3). No finalizer: removing this
# Application must not delete the metrics volume as a side effect.
# Wave 0, like metrics-server: nothing needs it at deploy time, so a Prometheus
# that cannot schedule must never gate the environments.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
    repoURL: https://github.com/beatos-learns/VSC-kubernetes-deployment.git
    targetRevision: main
    path: charts/monitoring
    helm:
      # short release name => monitoring-prometheus, monitoring-grafana, ...
      releaseName: monitoring
  destination:
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # node-exporter needs hostPath, hostNetwork and hostPID - `restricted`
        # would reject the DaemonSet that reads the nodes in the first place.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline
