# Validation gate for the Ops repo. Deliberately deploy-free:
# ArgoCD pulls from main — this workflow only proves that what lands
# on main renders, conforms, and references signed, existing artifacts
# (Aufgabe 4, Pipeline: no imperative deployment).
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # keep in sync with the DOKS cluster version
  KUBERNETES_VERSION: "1.33.1"
  HELM_VERSION: v3.21.4
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # argocd/ is a kustomize directory; the runner image does not ship either tool
  KUSTOMIZE_VERSION: v5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  YQ_VERSION: v4.45.4
  YQ_SHA256: b96de04645707e14a12f52c37e6266832e03c29e95b9b139cddcae7314466e69
  CRD_SCHEMAS: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
  # the Kyverno CLI judges the rendered manifests with charts/policies (Aufgabe 5, Kyverno)
  KYVERNO_VERSION: v1.19.1
  KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
  # every image/chart must carry a keyless signature from the CI repo's build
  # workflow; charts/policies enforces the same identity at admission
  COSIGN_IDENTITY_RE: '^https://github.com/beatos-learns/VSC-kubernetes-containers/\.github/workflows/build\.yml@refs/heads/(master|main)$'
  COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  chart:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [staging, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSfL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform

      - name: Install yq and the Kyverno CLI
        run: |
          set -euo pipefail
          curl -sSfL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          chmod +x yq
          curl -sSfL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum -c -
          tar -xzOf kyverno.tgz kyverno > kyverno-cli && chmod +x kyverno-cli # not ./kyverno: helm would take it for a local chart

      - name: Vendor the generic-stack dependency
        run: helm dependency build charts/auth-stack

      - name: Verify the chart dependency is signed by the CI repo
        run: |
          set -euo pipefail
          version=$(awk '/^  version:/{print $2}' charts/auth-stack/Chart.lock)
          cosign verify --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            --certificate-identity-regexp "$COSIGN_IDENTITY_RE" \
            "ghcr.io/beatos-learns/vsc-kubernetes-containers/charts/generic-stack:$version" >/dev/null
          echo "generic-stack $version: signature OK"

      - name: Lint
        run: >-
          helm lint charts/auth-stack
          --values charts/auth-stack/values.yaml
          --values charts/auth-stack/values-${{ matrix.environment }}.yaml
          --strict

      - name: Render
        run: >-
          helm template auth charts/auth-stack
          --namespace auth-${{ matrix.environment }}
          --values charts/auth-stack/values.yaml
          --values charts/auth-stack/values-${{ matrix.environment }}.yaml
          > rendered-${{ matrix.environment }}.yaml

      # Debug aid for red-gated PRs: what this commit would deploy.
      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-${{ matrix.environment }}
          path: rendered-${{ matrix.environment }}.yaml
          if-no-files-found: ignore
          retention-days: 90

      - name: Validate rendered manifests
        run: >-
          ./kubeconform -strict -summary
          -kubernetes-version "$KUBERNETES_VERSION"
          -schema-location default
          -schema-location "$CRD_SCHEMAS"
          rendered-${{ matrix.environment }}.yaml

      # What Kyverno will say at admission (charts/policies), before ArgoCD
      # finds out: the validate policies over the same render, placed in the
      # namespace the environment deploys to. The signature policy is not
      # exercised offline - cosign below is the gate for that.
      - name: Policies admit the rendered manifests
        run: |
          set -euo pipefail
          helm template policies charts/policies > policies.yaml
          ./yq 'select(. != null) | .metadata.namespace = "auth-${{ matrix.environment }}"' \
            rendered-${{ matrix.environment }}.yaml > namespaced-${{ matrix.environment }}.yaml
          ./kyverno-cli apply policies.yaml --resource namespaced-${{ matrix.environment }}.yaml --remove-color

      # A promotion may only merge when every referenced image exists and, for
      # the CI registry, was signed by the CI repo's build workflow (keyless,
      # Rekor-logged). The one image from elsewhere - the MySQL client of the
      # module service's seed Job - is admitted by digest only, exactly as
      # charts/policies (images.mysqlClient) admits it at the cluster.
      - name: Verify image references exist and are signed
        run: |
          set -euo pipefail
          registry=$(./yq -N '.images.registry' charts/policies/values.yaml)
          client=$(./yq -N '.images.mysqlClient' charts/policies/values.yaml)
          refs=$(grep -hoE '^\s+image: *"?[^" ]+' rendered-${{ matrix.environment }}.yaml | sed -E 's/^\s+image: *"?//' | sort -u)
          [ -n "$refs" ] || { echo "::error::no image references found"; exit 1; }
          for ref in $refs; do
            case "$ref" in
              "$registry"/*)
                skopeo inspect --no-tags "docker://$ref" >/dev/null
                cosign verify --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
                  --certificate-identity-regexp "$COSIGN_IDENTITY_RE" "$ref" >/dev/null
                echo "$ref: exists, signature OK" ;;
              "$client":*@sha256:*)
                # skopeo takes a tag or a digest, not both: the digest is what pins the image
                skopeo inspect --no-tags "docker://$client@${ref##*@}" >/dev/null
                echo "$ref: exists, pinned by digest (the seed client charts/policies admits)" ;;
              *)
                echo "::error::$ref is neither from $registry nor the digest-pinned $client"; exit 1 ;;
            esac
          done

  argocd-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSfL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform

      - name: Install kustomize, yq and the Kyverno CLI
        run: |
          set -euo pipefail
          curl -sSfL -o kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz kustomize
          curl -sSfL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          chmod +x yq
          curl -sSfL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum -c -
          tar -xzOf kyverno.tgz kyverno > kyverno-cli && chmod +x kyverno-cli # not ./kyverno: helm would take it for a local chart

      - name: Lint and render the cert-manager-issuer chart
        run: |
          helm lint charts/cert-manager-issuer --strict
          helm template infra-cert-manager-issuer charts/cert-manager-issuer > rendered-issuer.yaml

      - name: Lint and render the monitoring chart
        # --include-crds: the operator CRDs are what ArgoCD applies too
        run: |
          helm dependency build charts/monitoring
          helm lint charts/monitoring --strict
          helm template monitoring charts/monitoring --namespace monitoring \
            --include-crds > rendered-monitoring.yaml

      - name: Lint and render the monitoring CRD chart
        run: |
          helm dependency build charts/monitoring-crds
          helm lint charts/monitoring-crds --strict
          helm template infra-monitoring-crds charts/monitoring-crds --namespace monitoring \
            --include-crds > rendered-monitoring-crds.yaml

      - name: Lint and render the policies chart
        run: |
          helm lint charts/policies --strict
          helm template policies charts/policies > rendered-policies.yaml

      - name: Policies pin the signing identity this workflow verifies
        # Otherwise the cluster would admit what CI rejects, or the reverse.
        run: |
          set -euo pipefail
          re=$(./yq -N '.images.signer.subjectRegExp' charts/policies/values.yaml)
          issuer=$(./yq -N '.images.signer.issuer' charts/policies/values.yaml)
          [ "$re" = "$COSIGN_IDENTITY_RE" ] && [ "$issuer" = "$COSIGN_OIDC_ISSUER" ] \
            || { echo "::error::charts/policies/values.yaml images.signer differs from COSIGN_IDENTITY_RE / COSIGN_OIDC_ISSUER"; exit 1; }
          echo "signing identity: chart and workflow agree"

      - name: Policies reject the fixture, one policy per document
        # charts/policies/tests/violations.yaml: every Deployment breaks exactly
        # the policy its name starts with (violates-<policy>...). Fixed
        # expectations, so a rule that stops matching, or one that starts
        # rejecting a compliant Deployment, fails here and not on the cluster.
        run: |
          set -euo pipefail
          # the CLI prints deprecation warnings ahead of the report, and exits 1 on any fail
          { ./kyverno-cli apply rendered-policies.yaml --resource charts/policies/tests/violations.yaml \
              --policy-report --output-format json || true; } | sed -n '/^{/,$p' > policy-report.json
          jq -e -r '
            ["require-resources", "require-probes", "require-labels", "restrict-images", "verify-image-signatures"] as $policies
            | [ .results[] | select(.result == "fail") | {name: .resources[0].name, policy} ] as $fails
            | ([ .results[].resources[0].name ] | unique) as $docs
            | [ $docs[] | . as $d
                | ($fails | map(select(.name == $d) | .policy) | unique) as $got
                | ($d | sub("^violates-"; "")) as $s
                | [ $policies[] | . as $p | select($s | startswith($p)) ] as $want
                | select($got != $want)
                | "\($d): rejected by \(if ($got | length) == 0 then "nothing" else ($got | join(",")) end), expected \($want | join(","))" ] as $bad
            | if ($docs | length) == 0 then "::error::the fixture produced no results" | halt_error(1)
              elif ($bad | length) > 0 then ($bad | map("::error::" + .) | join("\n")) | halt_error(1)
              else "\($docs | length) documents, each rejected by the intended policy only" end' policy-report.json

      - name: CRD chart and operator chart pin the same operator release
        # charts/monitoring runs with crds.enabled=false and programs against
        # the API charts/monitoring-crds installs; a newer operator on older
        # CRDs (or the reverse) only fails at runtime, in the cluster.
        run: |
          set -euo pipefail
          op=$(helm show chart charts/monitoring/charts/kube-prometheus-stack-*.tgz | ./yq -N '.appVersion')
          crd=$(helm show chart charts/monitoring-crds/charts/prometheus-operator-crds-*.tgz | ./yq -N '.appVersion')
          [ -n "$op" ] && [ "$op" = "$crd" ] \
            || { echo "::error::kube-prometheus-stack targets operator '$op' but prometheus-operator-crds ships the CRDs of '$crd'"; exit 1; }
          echo "operator $op: chart and CRDs agree"

      - name: Grafana dashboards are valid JSON with unique uids
        # The sidecar drops a file it cannot parse and Grafana lets a duplicate
        # uid overwrite another dashboard - both without a word.
        run: |
          set -euo pipefail
          n=0
          for f in charts/monitoring/files/dashboards/*/*.json; do
            jq -e '.uid and .title and (.panels | length > 0)' "$f" >/dev/null \
              || { echo "::error::$f: not valid JSON, or uid/title/panels missing"; exit 1; }
            n=$((n + 1))
          done
          dupes=$(jq -r '.uid' charts/monitoring/files/dashboards/*/*.json | sort | uniq -d)
          [ -z "$dupes" ] || { echo "::error::duplicate dashboard uid(s): $dupes"; exit 1; }
          echo "$n dashboards, uids unique"

      - name: Every manifest in argocd/ is wired into the kustomization
        # The root app renders argocd/ through kustomize, so a file that is
        # neither in resources: nor a patch is silently not deployed and not
        # validated, where a plain directory source would pick it up for free.
        # Assumes flat filenames in resources: (no subdirectories, no remote bases).
        run: |
          set -euo pipefail
          t="${RUNNER_TEMP:-$(mktemp -d)}"
          ./yq -N '.resources[]' argocd/kustomization.yaml | sort -u > "$t/declared.txt"
          ./yq -N '["kustomization.yaml"] + [.patches[]?.path] | .[]' argocd/kustomization.yaml | sort -u > "$t/skip.txt"
          find argocd -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -printf '%P\n' \
            | { grep -vxF -f "$t/skip.txt" || true; } | sort -u > "$t/ondisk.txt"
          if ! diff -u "$t/declared.txt" "$t/ondisk.txt"; then
            echo '::error::argocd/kustomization.yaml resources do not match the files in argocd/ (- declared only, + on disk only)'
            exit 1
          fi

      - name: argocd/ source hygiene
        # The gates below read one document per resource file and address files
        # by name, so anything that breaks those assumptions must fail loudly
        # here rather than be skipped silently further down.
        run: |
          set -euo pipefail
          rc=0
          if ./yq -e '.metadata.annotations."argocd.argoproj.io/sync-wave"' argocd/root.yaml >/dev/null 2>&1; then
            echo '::error::argocd/root.yaml must not carry a sync-wave annotation - it would pull root into sync-defaults.patch and flip its deliberate prune: false'
            rc=1
          fi
          # a list in the patch REPLACES the target's list rather than merging,
          # so one added syncOptions entry would wipe every app's own options
          if ./yq -e '[.. | select(tag == "!!seq")] | length > 0' argocd/sync-defaults.patch >/dev/null 2>&1; then
            echo '::error::argocd/sync-defaults.patch contains a list field - kustomize replaces lists on this CRD, which would wipe each Application own syncOptions'
            rc=1
          fi
          while IFS= read -r f; do
            case "$f" in
              *[!A-Za-z0-9._-]*|"") echo "::error::resources entry '$f' is not a flat [A-Za-z0-9._-] filename; the argocd/ gates cannot address it"; rc=1; continue ;;
            esac
            if ! docs=$(./yq -N 'select(. != null) | di' "argocd/$f" 2>&1); then
              echo "::error::cannot read argocd/$f (listed in kustomization.yaml resources)"
              rc=1; continue
            fi
            n=$(printf '%s\n' "$docs" | grep -c . || true)
            [ "$n" = "1" ] || { echo "::error::argocd/$f holds $n YAML documents; each entry in resources: must hold exactly one"; rc=1; }
          done < <(./yq -N '.resources[]' argocd/kustomization.yaml)
          exit $rc

      - name: Render the ArgoCD manifests
        # Its own step, never piped into kubeconform: GitHub's default shell is
        # `bash -e` without pipefail and kubeconform exits 0 on an empty stream,
        # so a failed build would go green.
        run: ./kustomize build argocd/ > rendered-argocd.yaml

      - name: Render the load test manifests
        # loadtest/ is applied by hand per run (Aufgabe 2, Chaos Testing), not by ArgoCD -
        # it still has to build and conform like everything else in the repo.
        run: ./kustomize build loadtest/ > rendered-loadtest.yaml

      - name: Validate ArgoCD, cert-manager, monitoring, policy and load test manifests
        # CRD schemas from the community catalog; job name is ruleset-pinned.
        # -skip CustomResourceDefinition: the upstream store carries no schema
        # for the kind itself, and the operator CRDs ship verbatim with the
        # pinned chart - what this repo configures is validated above.
        # argocd/ AND rendered-argocd.yaml on purpose: the directory reports a
        # schema error against the file it lives in, which the rendered blob
        # cannot; the rendered file is what ArgoCD actually applies, and is the
        # only one where sync-defaults.patch has been merged in.
        run: >-
          ./kubeconform -strict -summary
          -kubernetes-version "$KUBERNETES_VERSION"
          -schema-location default
          -schema-location "$CRD_SCHEMAS"
          -skip CustomResourceDefinition
          argocd/ rendered-argocd.yaml rendered-issuer.yaml rendered-monitoring.yaml rendered-monitoring-crds.yaml rendered-policies.yaml rendered-loadtest.yaml

      - name: sync-defaults.patch adds, never overrides
        # A patch may fill in a field a manifest leaves unset - that is its job.
        # It must never CHANGE a value the manifest states, because then the
        # file and the cluster disagree with nothing to show for it. Derived
        # from the manifests themselves, so it still holds when the patch grows.
        # NOT paths(scalars): jq's select() drops a falsy value, so that form
        # never yields a path whose leaf is `false` or null - i.e. it is blind
        # to exactly `prune: false`, the case this gate exists for.
        run: |
          set -euo pipefail
          t="${RUNNER_TEMP:-$(mktemp -d)}"
          : > "$t/src.ndjson"
          while IFS= read -r f; do
            ./yq -o=json 'select(. != null)' "argocd/$f" >> "$t/src.ndjson"
          done < <(./yq -N '.resources[]' argocd/kustomization.yaml)
          jq -s '.' "$t/src.ndjson" > "$t/src.json"
          ./yq -o=json 'select(. != null)' rendered-argocd.yaml | jq -s '.' > "$t/ren.json"
          jq -n --slurpfile s "$t/src.json" --slurpfile r "$t/ren.json" -r '
            ($s[0]) as $src | ($r[0]) as $ren
            | [ $src[]
                | . as $d
                | ($ren[] | select(.kind == $d.kind and .metadata.name == $d.metadata.name)) as $out
                | paths(type != "object" and type != "array") as $p
                | select(($d | getpath($p)) != ($out | getpath($p)))
                | "\($d.kind)/\($d.metadata.name): \($p | join(".")) is \($d | getpath($p) | tojson) in the file but \($out | getpath($p) | tojson) after the patch" ]
            | if length == 0 then "no manifest value is overridden by sync-defaults.patch"
              else (map("::error::" + .) | join("\n")) | halt_error(1) end'

      - name: ArgoCD Application invariants
        # Over the BUILT manifests: catches a patch that stopped matching, a
        # dropped `namespace:` in kustomization.yaml, a project with no
        # AppProject, and root losing its prune: false.
        run: |
          set -euo pipefail
          declared=$(./yq -N '.resources | length' argocd/kustomization.yaml)
          ./yq -o=json 'select(. != null)' rendered-argocd.yaml | jq -s -r --argjson declared "$declared" '
            . as $docs
            | [ $docs[] | select(.kind == "Application") ] as $apps
            | ([ $docs[] | select(.kind == "AppProject") | .metadata.name ] + ["default"]) as $projects
            | ([ $apps[] | .metadata.name ] | group_by(.) | map(select(length > 1) | "duplicate Application name: \(.[0])")) as $dupes
            | ([ $docs[] | select(.kind != "Application" and .kind != "AppProject")
                 | "unexpected kind \(.kind)/\(.metadata.name) - argocd/ holds Applications and AppProjects only, because the namespace: argocd transformer rewrites other kinds (it renames a Namespace outright)" ]) as $kinds
            | ([ if ($docs | length) != $declared
                 then "argocd/ declares \($declared) resources but renders \($docs | length) documents - a resource rendered nothing, or one file holds several"
                 else empty end ]) as $counts
            | ($apps | map(
                .metadata.name as $n | .metadata as $m | .spec as $s |
                [ (if $m.namespace != "argocd" then "\($n): metadata.namespace is \($m.namespace // "unset"), expected argocd" else empty end),
                  (if ($s.destination.server // "") == "" then "\($n): no destination.server" else empty end),
                  (if $s.syncPolicy.automated == null then "\($n): no syncPolicy.automated" else empty end),
                  (if ($s.syncPolicy.retry.limit // 0) < 1 then "\($n): no syncPolicy.retry.limit" else empty end),
                  (if ($projects | index($s.project)) == null then "\($n): project \($s.project) has no AppProject in argocd/" else empty end),
                  (if $n == "root" and $s.syncPolicy.automated.prune != false then "root: automated.prune must stay false - the app-of-apps must never cascade-delete an environment" else empty end),
                  (if $n != "root" and $m.annotations["argocd.argoproj.io/sync-wave"] == null then "\($n): no sync-wave annotation - sync-defaults.patch does not match it" else empty end),
                  (if $s.syncPolicy.managedNamespaceMetadata != null and (($s.syncPolicy.syncOptions // []) | index("CreateNamespace=true")) == null then "\($n): managedNamespaceMetadata without CreateNamespace=true" else empty end)
                ]) | flatten) as $violations
            | ($kinds + $counts + $dupes + $violations)
            | if length == 0 then "\($apps | length) Applications, \($projects | length - 1) AppProjects: all invariants hold"
              else (map("::error::" + .) | join("\n")) | halt_error(1) end'

      - name: Render the upstream platform charts with their Applications' values
        # Traefik, cert-manager, Kyverno, metrics-server and ArgoCD as ArgoCD
        # renders them (values in argocd/infra-*.yaml, bootstrap/argocd-values.yaml),
        # for the two gates below.
        run: |
          set -euo pipefail
          t="${RUNNER_TEMP:-$(mktemp -d)}"
          render() { # <name> <application file> <release> <namespace> [values file]
            local repo chart ver values
            repo=$(./yq -N '.spec.source.repoURL // .spec.sources[0].repoURL' "argocd/$2")
            chart=$(./yq -N '.spec.source.chart // .spec.sources[0].chart' "argocd/$2")
            ver=$(./yq -N '.spec.source.targetRevision // .spec.sources[0].targetRevision' "argocd/$2")
            values=${5:-}
            if [ -z "$values" ]; then
              values="$t/$1.values.yaml"
              ./yq -N '.spec.source.helm.valuesObject' "argocd/$2" > "$values"
            fi
            helm template "$3" "$chart" --repo "$repo" --version "$ver" --namespace "$4" \
              --api-versions monitoring.coreos.com/v1 --values "$values" > "$t/$1.rendered.yaml"
          }
          render traefik infra-traefik.yaml infra-traefik traefik
          render cert-manager infra-cert-manager.yaml infra-cert-manager cert-manager
          render kyverno infra-kyverno.yaml infra-kyverno policy
          render metrics-server infra-metrics-server.yaml infra-metrics-server metrics-server
          render argocd argocd.yaml argocd argocd bootstrap/argocd-values.yaml

      - name: Platform charts render the ServiceMonitors their Applications enable
        # Traefik, cert-manager, Kyverno and ArgoCD are scraped through their own
        # charts' ServiceMonitors. A monitor that selects nothing reads as "no
        # traffic", so prove that every ServiceMonitor matches a Service of the
        # same render on a port that exists.
        run: |
          set -euo pipefail
          t="${RUNNER_TEMP:-$(mktemp -d)}"
          rc=0
          for name in traefik cert-manager kyverno argocd; do
            ./yq -o=json 'select(. != null)' "$t/$name.rendered.yaml" | jq -s -r --arg name "$name" '
              def matches($labels; $sel):
                (($sel.matchLabels // {}) | to_entries | all(($labels[.key] // null) == .value))
                and (($sel.matchExpressions // []) | all(. as $e | ($labels[$e.key] // null) as $v
                  | if $e.operator == "In" then ($e.values | index($v)) != null
                    elif $e.operator == "NotIn" then ($e.values | index($v)) == null
                    elif $e.operator == "Exists" then $v != null
                    elif $e.operator == "DoesNotExist" then $v == null
                    else false end));
              [ .[] | select(.kind == "ServiceMonitor") ] as $sms
              | [ .[] | select(.kind == "Service") ] as $svcs
              | if ($sms | length) == 0 then ["\($name): no ServiceMonitor rendered - its metrics are switched off"] else
                [ $sms[] | . as $sm
                  | ($sm.spec.endpoints | map(.port // .targetPort | tostring)) as $ports
                  | select(([ $svcs[] | select(matches(.metadata.labels // {}; $sm.spec.selector)
                        and any(.spec.ports[]; ((.name // "") as $n | ($ports | index($n)) != null)
                                             or ((.targetPort // "" | tostring) as $tp | ($ports | index($tp)) != null))) ] | length) == 0)
                  | "\($name): ServiceMonitor \($sm.metadata.name) matches no rendered Service on port(s) \($ports | join(","))" ] end
              | if length == 0 then "\($name): every ServiceMonitor selects a rendered Service"
                else (map("::error::" + .) | join("\n")) | halt_error(1) end' || rc=1
          done
          exit $rc

      - name: Policies admit the platform charts
        # require-resources (charts/policies) judges every namespace Kyverno
        # watches: a platform pod without full requests and limits would be
        # rejected at admission and its Application stuck. Kyverno's own
        # namespace is exempt; helm test hooks are dropped (never applied).
        run: |
          set -euo pipefail
          t="${RUNNER_TEMP:-$(mktemp -d)}"
          for f in "$t"/traefik.rendered.yaml "$t"/cert-manager.rendered.yaml "$t"/metrics-server.rendered.yaml \
                   "$t"/argocd.rendered.yaml rendered-monitoring.yaml rendered-loadtest.yaml; do
            ./yq 'select(. != null) | select((.metadata.annotations."helm.sh/hook" // "") != "test")' "$f" > "$t/judged.yaml"
            echo "== $f"
            ./kyverno-cli apply rendered-policies.yaml --resource "$t/judged.yaml" --remove-color
          done

  terraform:
    # Aufgabe 3 (Terraform): the cluster definition must always format, initialise and
    # validate. No token here on purpose - init -backend=false only fetches the
    # pinned provider; the drift check (`terraform plan`) is a local,
    # authenticated step (terraform/README.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff

      - name: terraform init (no backend, no credentials)
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=terraform validate
