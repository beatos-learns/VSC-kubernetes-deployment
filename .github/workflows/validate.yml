# Validation gate for the Ops repo. Deliberately deploy-free:
# ArgoCD pulls from main — this workflow only proves that what lands
# on main renders and conforms (Aufgabe 4: no imperative deployment).
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # keep in sync with the DOKS cluster version
  KUBERNETES_VERSION: "1.33.1"

jobs:
  chart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, prod]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Vendor the generic-stack dependency
        run: helm dependency build charts/auth-stack

      - name: Lint
        run: >-
          helm lint charts/auth-stack
          --values charts/auth-stack/values.yaml
          --values charts/auth-stack/values-${{ matrix.environment }}.yaml
          --strict

      - name: Render
        run: >-
          helm template auth charts/auth-stack
          --namespace auth-${{ matrix.environment }}
          --values charts/auth-stack/values.yaml
          --values charts/auth-stack/values-${{ matrix.environment }}.yaml
          > rendered-${{ matrix.environment }}.yaml

      # Debug aid for red-gated PRs: what this commit would deploy.
      # Runs even when a later step fails; skipped silently when lint or
      # render already failed and there is nothing to upload.
      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-${{ matrix.environment }}
          path: rendered-${{ matrix.environment }}.yaml
          if-no-files-found: ignore
          retention-days: 14

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
      - name: Validate rendered manifests
        run: >-
          ./kubeconform -strict -summary
          -kubernetes-version "$KUBERNETES_VERSION"
          rendered-${{ matrix.environment }}.yaml

  argocd-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
      - name: Validate ArgoCD and cert-manager manifests
        # CRD schemas (Application, AppProject, ClusterIssuer) come from the
        # community CRDs catalog. The job name is pinned by the
        # main-protection ruleset - do not rename.
        run: >-
          ./kubeconform -strict -summary
          -kubernetes-version "$KUBERNETES_VERSION"
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          argocd/ bootstrap/root-application.yaml cert-manager-issuer/
