# ---------------------------------------------------------------------------
# Staging environment (namespace: auth-staging) - only what differs from
# values.yaml.
#
# The image tags below are written by the CI promote job
# (VSC-kubernetes-containers build.yml, branch promote/staging, auto-merged
# on green validate). Do not reformat these lines: the job edits them in
# place, anchored on the trailing comment.
# ---------------------------------------------------------------------------

generic-stack:
  components:
    db:
      image:
        tag: "0.0.1" # promoted by CI
      persistence:
        size: 1Gi

    backend:
      image:
        tag: "0.0.1" # promoted by CI
      # same scaling mechanics as prod, smaller bounds
      hpa:
        enabled: true
        minReplicas: 1
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
      pdb:
        enabled: true
        maxUnavailable: 1

    frontend:
      image:
        tag: "0.0.1" # promoted by CI
      pdb:
        enabled: true
        maxUnavailable: 1
      ingress:
        # nip.io host on the Traefik LB IP (bootstrap/README.md step 6)
        hosts:
          - host: auth-staging.146-190-177-37.nip.io
        tls:
          - hosts:
              - auth-staging.146-190-177-37.nip.io
            secretName: auth-staging-tls

dbBackup:
  keep: 3

namespacePolicy:
  # limits.cpu 3: db 0.5 + frontend 0.2 + backend 2x0.5 + surge 0.5 + 0.2 +
  # backup 0.5 + ACME solver 0.1 = 3.0 (memory worst case ~1.7Gi of 2Gi)
  resourceQuota:
    pods: 10
