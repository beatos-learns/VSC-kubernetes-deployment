# ---------------------------------------------------------------------------
# Staging environment (namespace: auth-staging)
#
# The image tags below are the PROMOTION TARGET: the CI pipeline in
# VSC-kubernetes-containers commits tag bumps here on every successful
# build of the main branch. Do not reformat these lines.
# ---------------------------------------------------------------------------

generic-stack:
  components:
    db:
      image:
        tag: "0.0.1" # promoted by CI
      persistence:
        size: 1Gi

    backend:
      image:
        tag: "0.0.1" # promoted by CI

    frontend:
      image:
        tag: "0.0.1" # promoted by CI
      ingress:
        hosts:
          # nip.io wildcard DNS resolving to the Traefik LB's external IP
          # (`kubectl get svc -n traefik infra-traefik` -> 143.244.204.227)
          - host: auth-staging.143-244-204-227.nip.io
        tls:
          - hosts:
              - auth-staging.143-244-204-227.nip.io
            secretName: auth-staging-tls

namespacePolicy:
  resourceQuota:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
    pods: 10
