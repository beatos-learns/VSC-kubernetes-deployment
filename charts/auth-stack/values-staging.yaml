# ---------------------------------------------------------------------------
# Staging environment (namespace: auth-staging) - only what differs from
# values.yaml.
#
# The image tags below are written by the CI promote job
# (VSC-kubernetes-containers build.yml, branch promote/staging, auto-merged
# on green validate). Do not reformat these lines: the job edits them in
# place, anchored on the trailing comment.
# ---------------------------------------------------------------------------

generic-stack:
  components:
    # psql client of the schema seed Job (the component itself is disabled)
    db:
      image:
        tag: "0.0.1" # promoted by CI

    backend:
      image:
        tag: "0.0.2" # promoted by CI
      # same scaling mechanics as prod, smaller bounds
      hpa:
        enabled: true
        minReplicas: 1
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
      pdb:
        enabled: true
        maxUnavailable: 1

    frontend:
      image:
        tag: "0.0.1" # promoted by CI
      pdb:
        enabled: true
        maxUnavailable: 1
      ingress:
        # nip.io host on the Traefik LB IP (bootstrap/README.md step 6)
        hosts:
          - host: auth-staging.139-59-206-48.nip.io
        tls:
          - hosts:
              - auth-staging.139-59-206-48.nip.io
            secretName: auth-staging-tls

# Staging is where a promotion is verified, so failures are part of the job:
# the same alerts fire (that is what makes them testable) with more room.
monitoring:
  alerts:
    errorRatePercent: 10
    latencySeconds: 2
    loginFailuresPerSecond: 1

namespacePolicy:
  # limits.cpu 3: frontend 0.2 + backend 2x0.5 + surge 0.5 + 0.2 + seed Job 0.2 +
  # ACME solver 0.1 = 2.2 (memory worst case ~1.1Gi of 2Gi)
  resourceQuota:
    pods: 10
