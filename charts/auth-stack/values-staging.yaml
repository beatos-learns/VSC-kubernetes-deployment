# ---------------------------------------------------------------------------
# Staging environment (namespace: auth-staging) - only what differs from
# values.yaml.
#
# The image tags below are written by the CI promote job
# (VSC-kubernetes-containers build.yml, branch promote/staging, auto-merged
# on green validate). Do not reformat these lines: the job edits them in
# place, anchored on the trailing comment.
# ---------------------------------------------------------------------------

generic-stack:
  # Access logs on every HTTP component (the frontend has them on by default,
  # the backend and the module service off): staging is where a promotion is
  # verified, so every request leaves a line here. Written to ACCESS_LOG by the chart.
  monitoring:
    logging:
      access: true

  components:
    # psql client of the schema seed Job (the component itself is disabled)
    db:
      image:
        tag: "0.0.2" # promoted by CI

    backend:
      image:
        tag: "0.0.6" # promoted by CI
      # same scaling mechanics as prod, smaller bounds
      hpa:
        enabled: true
        minReplicas: 1
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
      pdb:
        enabled: true
        maxUnavailable: 1
      ingress:
        # the API on the environment's host (bootstrap/README.md step 6)
        hosts:
          - host: auth-staging.129-212-254-51.nip.io
            paths:
              - path: /users
              - path: /modules
        tls:
          - hosts:
              - auth-staging.129-212-254-51.nip.io
            secretName: auth-staging-tls

    frontend:
      image:
        tag: "0.0.3" # promoted by CI
      pdb:
        enabled: true
        maxUnavailable: 1
      ingress:
        # nip.io host on the Traefik LB IP (bootstrap/README.md step 6)
        hosts:
          - host: auth-staging.129-212-254-51.nip.io
        tls:
          - hosts:
              - auth-staging.129-212-254-51.nip.io
            secretName: auth-staging-tls

    modules:
      image:
        tag: "0.0.2" # promoted by CI
      pdb:
        enabled: true
        maxUnavailable: 1

# Staging is where a promotion is verified, so failures are part of the job:
# the same alerts fire (that is what makes them testable) with more room.
monitoring:
  alerts:
    errorRatePercent: 10
    latencySeconds: 2
    loginFailuresPerSecond: 1

namespacePolicy:
  # limits.cpu 4: frontend 0.2 + backend 2x0.5 + modules 0.5 + surge 0.5 + 0.2 + 0.5 +
  # seed Jobs 2x0.2 + ACME solver 0.1 = 3.4 (memory worst case ~1.7Gi of 2Gi)
  resourceQuota:
    limits:
      cpu: "4"
    pods: 12
