# ---------------------------------------------------------------------------
# Production environment (namespace: auth-prod) - only what differs from
# values.yaml.
#
# The image tags below are written by the CI promote job
# (VSC-kubernetes-containers build.yml, branch promote/prod) and merged by a
# human after verification on staging. Do not reformat these lines: the job
# edits them in place, anchored on the trailing comment.
# ---------------------------------------------------------------------------

generic-stack:
  components:
    db:
      image:
        tag: "0.0.1" # promoted via PR
      persistence:
        size: 2Gi

    backend:
      image:
        tag: "0.0.1" # promoted via PR
      # Aufgabe 6: autoscaled (the chart omits `replicas` from the workload)
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 5
        targetCPUUtilizationPercentage: 70
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 60
      # scales with the HPA (minAvailable would be a fixed floor)
      pdb:
        enabled: true
        maxUnavailable: 1

    frontend:
      image:
        tag: "0.0.1" # promoted via PR
      replicas: 2
      pdb:
        enabled: true
        maxUnavailable: 1
      ingress:
        # nip.io host on the Traefik LB IP (bootstrap/README.md step 6)
        hosts:
          - host: auth-prod.146-190-206-27.nip.io
        tls:
          - hosts:
              - auth-prod.146-190-206-27.nip.io
            secretName: auth-prod-tls

dbBackup:
  keep: 7
  storage: 5Gi

# Tighter than staging: in production these thresholds are the SLO.
monitoring:
  alerts:
    errorRatePercent: 2
    latencySeconds: 0.8
    loginFailuresPerSecond: 0.2

namespacePolicy:
  # limits.cpu 5: db 0.5 + frontend 2x0.2 + backend 5x0.5 + surge 0.5 + 0.2 +
  # backup 0.5 + ACME solver 0.1 = 4.7 (memory worst case ~2.6Gi of 4Gi)
  resourceQuota:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "5"
      memory: 4Gi
    pods: 20
    storage: 10Gi
    persistentVolumeClaims: 3
