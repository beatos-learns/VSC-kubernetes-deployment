{{- with .Values.namespacePolicy.networkPolicy }}
{{- if .enabled }}
{{/*
  Namespace isolation (Aufgabe 5): deny all ingress AND egress, then allow only
  the flows of the stack: edge -> frontend -> backend -> db, DNS for everyone,
  cert-manager's HTTP-01 solver from the edge, metrics from a monitoring
  namespace, the backup job -> db. Ports come from the generic-stack component
  definitions. Kubelet probes come from the node (unaffected).
*/}}
{{- $gs := index $.Values "generic-stack" }}
{{- $ports := dict
      "frontend" $gs.components.frontend.ports.main.containerPort
      "backend"  $gs.components.backend.ports.main.containerPort
      "db"       $gs.components.db.ports.main.containerPort
      "admin"    $gs.componentDefaults.ports.admin.containerPort }}
{{- $labels := include "auth-stack.labels" $ }}
{{- $edge := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .ingressControllerNamespace)) }}
{{- $frontend := dict "podSelector" (dict "matchLabels" (fromYaml (include "auth-stack.componentSelector" (dict "root" $ "name" "frontend")))) }}
{{- $backend := dict "podSelector" (dict "matchLabels" (fromYaml (include "auth-stack.componentSelector" (dict "root" $ "name" "backend")))) }}
{{- $db := dict "podSelector" (dict "matchLabels" (fromYaml (include "auth-stack.componentSelector" (dict "root" $ "name" "db")))) }}
{{- $backup := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "db-backup" "app.kubernetes.io/instance" $.Release.Name)) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-default-deny
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-allow-dns-egress
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-frontend
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    {{- toYaml $frontend.podSelector | nindent 4 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - {{- toYaml $edge | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ $ports.frontend }}
  egress:
    - to:
        - {{- toYaml $backend | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ $ports.backend }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-backend
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    {{- toYaml $backend.podSelector | nindent 4 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - {{- toYaml $frontend | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ $ports.backend }}
  egress:
    - to:
        - {{- toYaml $db | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ $ports.db }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-db
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    {{- toYaml $db.podSelector | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - {{- toYaml $backend | nindent 10 }}
        - {{- toYaml $backup | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ $ports.db }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-db-backup
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    {{- toYaml $backup.podSelector | nindent 4 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - {{- toYaml $db | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ $ports.db }}
{{- if .acmeSolver.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-acme-solver
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - {{- toYaml $edge | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ .acmeSolver.port }}
{{- end }}
{{- if .monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-allow-metrics
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .monitoring.namespace }}
      ports:
        - protocol: TCP
          port: {{ $ports.admin }}
{{- end }}
{{- end }}
{{- end }}
