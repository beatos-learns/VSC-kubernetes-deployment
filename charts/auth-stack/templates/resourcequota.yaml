{{- with .Values.namespacePolicy.resourceQuota }}
{{- if .enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $.Release.Name }}-quota
  labels:
    {{- include "auth-stack.labels" $ | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .requests.cpu | quote }}
    requests.memory: {{ .requests.memory | quote }}
    limits.cpu: {{ .limits.cpu | quote }}
    limits.memory: {{ .limits.memory | quote }}
    pods: {{ .pods | quote }}
    requests.storage: {{ .storage | quote }}
    persistentvolumeclaims: {{ .persistentVolumeClaims | quote }}
    # no per-environment load balancers / node ports: the cluster Traefik is the only edge
    services.loadbalancers: "0"
    services.nodeports: "0"
{{- end }}
{{- end }}
