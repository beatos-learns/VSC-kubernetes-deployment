{{- with .Values.monitoring }}
{{- if .enabled }}
{{/*
  Aufgabe 7: one PodMonitor per enabled generic-stack component. Every image
  serves /metrics on its admin port (the port the probes use), so the cluster
  Prometheus (ns monitoring, argocd/infra-monitoring.yaml) scrapes the pods
  directly - every HPA replica, no Service port needed. `job` is the component
  name (backend, frontend) on every series, and the pods' name/version labels
  travel with the series so dashboards can group by component and by running
  image tag. An extra container port named `metrics` (the proxy's Traefik
  port 9101) is scraped as a second endpoint. The default-deny NetworkPolicy
  admits the admin port from the monitoring namespace
  (namespacePolicy.networkPolicy.monitoring).
*/}}
{{- $gs := index $.Values "generic-stack" }}
{{- $mon := . }}
{{- range $name, $raw := $gs.components }}
{{- $spec := mustMergeOverwrite (deepCopy $gs.componentDefaults) (deepCopy $raw) }}
{{- if $spec.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "auth-stack.componentName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "auth-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  jobLabel: app.kubernetes.io/name
  podTargetLabels:
    - app.kubernetes.io/name
    - app.kubernetes.io/version
  selector:
    matchLabels:
      {{- include "auth-stack.componentSelector" (dict "root" $ "name" $name) | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  podMetricsEndpoints:
    - port: {{ $spec.ports.admin.name }}
      path: /metrics
      scheme: http
      interval: {{ $mon.interval }}
      scrapeTimeout: {{ $mon.scrapeTimeout }}
    {{- range $spec.ports.extra }}
    {{- if eq .name "metrics" }}
    - port: {{ .name }}
      path: /metrics
      scheme: http
      interval: {{ $mon.interval }}
      scrapeTimeout: {{ $mon.scrapeTimeout }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
