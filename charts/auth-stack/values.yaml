# ---------------------------------------------------------------------------
# Common configuration shared by every environment; the overlays
# (values-staging.yaml / values-prod.yaml) state only what differs.
#
# Everything under `generic-stack:` is passed to the dependency chart and is
# validated by its values.schema.json. The other top-level keys drive this
# wrapper chart's own templates (namespace policy, edge policy, schema seeds)
# and are validated by ./values.schema.json.
# ---------------------------------------------------------------------------

generic-stack:
  # The GHCR packages are public, so no pull secret is needed. For private
  # packages create `ghcr-pull` per namespace (bootstrap/README.md) and set
  # global.imagePullSecrets: [{ name: ghcr-pull }].

  components:
    # Off: the cluster-wide Traefik ingress controller
    # (argocd/infra-traefik.yaml) serves the Ingresses below.
    proxy:
      enabled: false

    # Off: PostgreSQL is the managed DigitalOcean database (terraform/) - no pod,
    # Service or PVC in the cluster. The image tag the overlays promote is the
    # psql client of the schema seed Job (templates/db-seed-job.yaml).
    db:
      enabled: false

    backend:
      # Secret created out-of-band (bootstrap/README.md): the managed database's
      # endpoint and login role (db-url, db-user, db-password) plus jwt-secret.
      # The chart's own datasource wiring (in-cluster db component) is nulled
      # out here; the Secret's keys take its place. MODULE_SERVICE_URL stays
      # the chart's: the modules Service of this release (Aufgabe 6).
      existingSecret: auth-stack-secrets
      env:
        SPRING_DATASOURCE_URL: null
        SPRING_DATASOURCE_USERNAME: null
        # The seed SQL owns the schema: the backend only validates it, never
        # alters it implicitly (same in staging, so drift fails there first).
        SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      secretEnv:
        SPRING_DATASOURCE_URL: db-url
        SPRING_DATASOURCE_USERNAME: db-user
      minReadySeconds: 5
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      # The REST API at the edge, next to the frontend on the same host: the
      # module endpoints (/modules, /users/{id}/modules/{moduleId}) are not
      # proxied by the frontend, so a client reaches them here (Aufgabe 6).
      # TLS reuses the environment's certificate (issued for the frontend
      # Ingress); hosts, paths and tls are set per environment.
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: '{{ .Release.Namespace }}-{{ .Release.Name }}-security-headers@kubernetescrd'

    frontend:
      minReadySeconds: 5
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      ingress:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-staging # charts/cert-manager-issuer
          # security-headers Middleware rendered by templates/middleware.yaml
          traefik.ingress.kubernetes.io/router.middlewares: '{{ .Release.Namespace }}-{{ .Release.Name }}-security-headers@kubernetescrd'
        # hosts and tls are set per environment

    # The module service (Aufgabe 6): in-cluster only, called by the backend
    # through its Service. Its managed MySQL (terraform/) is reached with the
    # connection URL and the cluster CA from the environment Secret - the only
    # pod that receives those keys (secretMount.keys); the backend has none.
    modules:
      existingSecret: auth-stack-secrets
      env:
        MYSQL_SSL_MODE: verify-identity
        MYSQL_SSL_CA: /run/secrets/mysql-ca
      secretMount:
        keys:
          - database-url
          - mysql-ca
      minReadySeconds: 5
      # Vertical sizing: one uvicorn event loop, so CPU beyond one core buys
      # nothing; memory covers the native binary (~60Mi idle) plus the pool.
      resources:
        requests:
          cpu: 100m
          memory: 96Mi
        limits:
          cpu: 500m
          memory: 256Mi

# ---------------------------------------------------------------------------
# Edge policy (rendered by templates/middleware.yaml)
# ---------------------------------------------------------------------------
edge:
  securityHeaders:
    enabled: true
    hstsSeconds: 31536000

# ---------------------------------------------------------------------------
# Schema seed (templates/db-seed-job.yaml): an ArgoCD PreSync hook applies the
# SQL below to the managed database before every sync, as the cluster admin
# from the Secret. Every statement is idempotent, so the same file is the
# migration path - extend it with idempotent ALTERs and merge. The application
# role is granted DML only.
# ---------------------------------------------------------------------------
dbSeed:
  enabled: true
  image:
    registry: ghcr.io/beatos-learns/vsc-kubernetes-containers
    repository: postgresql
    tag: "" # empty = components.db.image.tag (psql of the same major version)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  files:
    10-user-mgmt-authorities.sql: |
      -- ============================================================================
      -- user-mgmt-service: schema + authority seed (PostgreSQL 16)
      --
      -- Target  : github.com/yagan93/user_mgmt_service @ 747b7f4e3d1f09cc4434a75d9c991ea091fda548
      --           + the CI repo's patches/0001-module-assignment.patch (users_module)
      --           Spring Boot 4.1.0-M3 / Hibernate ORM 7.2.7.Final / PostgreSQL JDBC 42.7.10
      -- Mounted : charts/auth-stack dbSeed.files -> /seed in the db-seed Job (ArgoCD PreSync hook)
      -- Runner  : psql -v ON_ERROR_STOP=1 -v app_user=<login role> -f <file>, as the cluster
      --           admin of the managed database, before every sync
      -- Content : 1. the tables Hibernate generates for the pinned commit (so `ddl-auto=update`
      --              has nothing to do and `ddl-auto=validate` passes),
      --           2. authorities USER_MODIFY / USER_DELETE,
      --           3. role ADMIN holding both,
      --           4. trigger: the FIRST registered user is granted ADMIN (the application has
      --              no other path that ever assigns a role to a user),
      --           5. DML grants for the application role (psql variable app_user).
      -- Idempotent: every statement tolerates re-execution.
      -- ============================================================================

      BEGIN;

      -- 1. schema -------------------------------------------------------------------
      -- Verbatim what Hibernate 7.2.7 (PostgreSQLDialect) emitted for this commit with
      -- ddl-auto=update on an empty database (column order, types, constraint names):
      --   java.util.UUID -> uuid, String -> varchar(255), LocalDateTime -> timestamp(6).
      -- Constraint names = Hibernate implicit names (FK|UK + base35(MD5("table`t`[references`r`]column`c`")));
      -- PostgreSQL folds them to lower case, exactly as it does for Hibernate's own DDL.

      CREATE TABLE IF NOT EXISTS authority (
          id   uuid         NOT NULL,
          name varchar(255) NOT NULL,
          PRIMARY KEY (id),
          CONSTRAINT UKjdeu5vgpb8k5ptsqhrvamuad2 UNIQUE (name)
      );

      CREATE TABLE IF NOT EXISTS role (
          id   uuid         NOT NULL,
          name varchar(255) NOT NULL,
          PRIMARY KEY (id),
          CONSTRAINT UK8sewwnpamngi6b1dwaa88askk UNIQUE (name)
      );

      CREATE TABLE IF NOT EXISTS role_authority (
          role_id      uuid NOT NULL,
          authority_id uuid NOT NULL,
          PRIMARY KEY (role_id, authority_id),
          CONSTRAINT FKqbri833f7xop13bvdje3xxtnw FOREIGN KEY (authority_id) REFERENCES authority (id),
          CONSTRAINT FK2052966dco7y9f97s1a824bj1 FOREIGN KEY (role_id)      REFERENCES role (id)
      );

      CREATE TABLE IF NOT EXISTS users (
          id               uuid         NOT NULL,
          created_at       timestamp(6),
          modified_at      timestamp(6),
          email            varchar(255) NOT NULL,
          first_name       varchar(255),
          last_name        varchar(255),
          password         varchar(255),
          created_by       uuid,
          last_modified_by uuid,
          PRIMARY KEY (id),
          CONSTRAINT UK6dotkott2kjsp8vw4d0m25fb7 UNIQUE (email),
          CONSTRAINT FKibk1e3kaxy5sfyeekp8hbhnim FOREIGN KEY (created_by)       REFERENCES users (id),
          CONSTRAINT FKj1vmabulqqfwd5q8w2wxm73c3 FOREIGN KEY (last_modified_by) REFERENCES users (id)
      );

      CREATE TABLE IF NOT EXISTS users_role (
          users_id uuid NOT NULL,
          role_id  uuid NOT NULL,
          PRIMARY KEY (users_id, role_id),
          CONSTRAINT FK3qjq7qsiigxa82jgk0i0wuq3g FOREIGN KEY (role_id)  REFERENCES role (id),
          CONSTRAINT FKiu0xsee0dmwa28nffgyf4bcvc FOREIGN KEY (users_id) REFERENCES users (id)
      );

      -- Module assignments (@ElementCollection Set<UUID> User.moduleIds, collection table
      -- users_module): the module ids live in the module service's MySQL, so there is no
      -- foreign key to them here. The primary key states the Set semantics.
      CREATE TABLE IF NOT EXISTS users_module (
          users_id  uuid NOT NULL,
          module_id uuid NOT NULL,
          PRIMARY KEY (users_id, module_id),
          CONSTRAINT FKhy3sfjmxbx62dsi1nm1ub26ts FOREIGN KEY (users_id) REFERENCES users (id)
      );

      -- 2. authorities (the names UserController's @PreAuthorize checks) -----------------
      INSERT INTO authority (id, name) VALUES
          ('b7c1e2a4-9d3f-4c6e-8a15-2f7d9e0b4c63', 'USER_MODIFY'),
          ('e4a9d0c2-5b7f-4e1a-9c38-6d2f8b1a7e05', 'USER_DELETE')
      ON CONFLICT (name) DO NOTHING;

      -- 3. role ADMIN = USER_MODIFY + USER_DELETE ----------------------------------------
      INSERT INTO role (id, name) VALUES
          ('3f8b6c1d-a2e4-4d9b-b071-5c9e2d4f8a16', 'ADMIN')
      ON CONFLICT (name) DO NOTHING;

      INSERT INTO role_authority (role_id, authority_id)
      SELECT r.id, a.id
      FROM role r CROSS JOIN authority a
      WHERE r.name = 'ADMIN' AND a.name IN ('USER_MODIFY', 'USER_DELETE')
      ON CONFLICT DO NOTHING;

      -- 4. bootstrap: the first registered user becomes ADMIN -----------------------------
      -- POST /users/register always stores an empty role set; PUT /users/{id} (the only way to
      -- assign roles) itself requires USER_MODIFY. Without this trigger nobody can ever obtain it.
      -- Fires only while no user holds ADMIN, so it also re-arms if the last admin is deleted.
      CREATE OR REPLACE FUNCTION users_bootstrap_admin() RETURNS trigger
      LANGUAGE plpgsql AS $$
      BEGIN
          IF NOT EXISTS (SELECT 1 FROM users_role ur JOIN role r ON r.id = ur.role_id WHERE r.name = 'ADMIN') THEN
              INSERT INTO users_role (users_id, role_id)
              SELECT NEW.id, r.id FROM role r WHERE r.name = 'ADMIN'
              ON CONFLICT DO NOTHING;
          END IF;
          RETURN NEW;
      END
      $$;

      DROP TRIGGER IF EXISTS users_bootstrap_admin ON users;
      CREATE TRIGGER users_bootstrap_admin
          AFTER INSERT ON users
          FOR EACH ROW EXECUTE FUNCTION users_bootstrap_admin();

      -- 5. the application role: DML on these and on future tables, nothing else ---------
      GRANT USAGE ON SCHEMA public TO :"app_user";
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :"app_user";
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"app_user";

      COMMIT;

# ---------------------------------------------------------------------------
# Schema seed of the module service (templates/mysql-seed-job.yaml, Aufgabe 6):
# the same PreSync mechanism against the managed MySQL. The service runs no
# migrations and its `schema` health check stays red until the `modules` table
# exists, so the upstream schema.sql (idempotent: IF NOT EXISTS / INSERT IGNORE)
# is applied before every sync, as the cluster admin from the Secret. The
# client is Docker's official MySQL image, pinned by digest - the one image
# outside the CI registry, admitted as such by charts/policies (images.mysqlClient).
# ---------------------------------------------------------------------------
mysqlSeed:
  enabled: true
  image:
    registry: docker.io
    repository: library/mysql
    tag: "8.4.11"
    digest: sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  files:
    10-module-service-schema.sql: |
      -- ============================================================================
      -- module-service: schema + module seed (MySQL 8)
      --
      -- Source  : github.com/yagan93/module_service @ e86baa4aa0f0bc53b0685edbb05a1c3a8d4b9494,
      --           schema.sql verbatim (the service never creates or migrates tables)
      -- Mounted : charts/auth-stack mysqlSeed.files -> /seed in the mysql-seed Job (ArgoCD PreSync hook)
      -- Runner  : mysql --ssl-mode=<components.modules.env.MYSQL_SSL_MODE> < <file>, as the cluster
      --           admin of the managed database, before every sync
      -- Idempotent: every statement tolerates re-execution.
      -- ============================================================================

      CREATE TABLE IF NOT EXISTS modules (
          id CHAR(36) NOT NULL,
          code VARCHAR(32) NOT NULL,
          name VARCHAR(150) NOT NULL,
          description TEXT NULL,
          created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
          updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
          PRIMARY KEY (id),
          UNIQUE INDEX ix_modules_code (code)
      );

      INSERT IGNORE INTO modules (id, code, name, description)
      VALUES
          (
              'c02f58f2-3aca-4f1e-8076-bacf6f1999e6',
              'CLOUD-ARCH',
              'Cloud Architecture',
              'Designing reliable and scalable cloud systems'
          ),
          (
              '6d5889ee-f4c7-44d7-a887-da92d2a51ac4',
              'DATABASES',
              'Database Systems',
              'Relational data modeling and SQL fundamentals'
          ),
          (
              '674ca4e0-6334-4b12-aa83-d97895049b8a',
              'SECURITY',
              'Application Security',
              'Secure software design and common vulnerabilities'
          ),
          (
              '4b9ff45a-d90f-42b0-8b72-20f0b92b6027',
              'WEB-DEV',
              'Web Development',
              'Building modern web applications and APIs'
          );

# ---------------------------------------------------------------------------
# Observability (Aufgabe 7): one PodMonitor per component points the cluster
# Prometheus (ns monitoring, charts/monitoring) at the admin port every image
# serves /metrics on (templates/podmonitor.yaml), the PrometheusRule states
# what counts as broken - for the backend, the frontend, the module service
# and the hops between them. Both are deployment policy, so the scrape and the
# thresholds live here and in the overlays - not in the application chart.
# ---------------------------------------------------------------------------
monitoring:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

  alerts:
    enabled: true
    # Share of 5xx responses that means "the API is failing its users".
    errorRatePercent: 5
    # p95 of the server-side request duration.
    latencySeconds: 1
    # Rejected logins per second: credential stuffing, or a JWT/database
    # configuration that stopped accepting valid credentials.
    loginUri: /users/login
    loginFailuresPerSecond: 0.5

# ---------------------------------------------------------------------------
# Namespace policy (rendered by templates/)
# ---------------------------------------------------------------------------
namespacePolicy:
  # Hard caps per namespace (Aufgabe 5, Namespaces). With a cpu/memory quota active every
  # pod MUST declare requests and limits (the LimitRange below fills gaps).
  # Sizing rule for limits: sum(maxReplicas x limits) + one rolling-update
  # surge pod per Deployment + the two seed Jobs + the ACME solver pod. No
  # storage: both databases are managed, nothing in the namespace claims a volume.
  resourceQuota:
    enabled: true
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 2Gi
    pods: 15
    storage: "0"
    persistentVolumeClaims: 0

  limitRange:
    enabled: true
    container:
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi

  # Default-deny ingress + egress with explicit flows (Aufgabe 5, Namespaces); ports are
  # taken from the generic-stack component definitions. See
  # templates/networkpolicy.yaml. Kubelet probes come from the node and are
  # not affected (Cilium host entity on DOKS).
  networkPolicy:
    enabled: true
    ingressControllerNamespace: traefik
    dnsNamespace: kube-system
    # cert-manager's HTTP-01 solver pods run in this namespace
    acmeSolver:
      enabled: true
      port: 8089
    # a Prometheus in this namespace may scrape the admin ports (/metrics)
    monitoring:
      enabled: true
      namespace: monitoring
    # the managed PostgreSQL's private endpoint: an address inside the cluster's
    # VPC (DigitalOcean's private range), on its PostgreSQL port - the backend's
    # and the seed Job's only egress besides DNS
    database:
      cidr: 10.0.0.0/8
      port: 25060
    # the managed MySQL of the module service, same VPC, DigitalOcean's MySQL
    # port - reached by the modules pods and their seed Job only
    modulesDatabase:
      cidr: 10.0.0.0/8
      port: 25060
