# ---------------------------------------------------------------------------
# Monitoring stack configuration (Aufgabe 7). This file is the only place the
# stack is configured: no `--set`, no changes saved in the Grafana UI.
# Everything under `kube-prometheus-stack:` is passed to the dependency chart;
# the `dashboards:` block drives this wrapper's own template, which turns
# files/dashboards/<folder>/*.json into sidecar-labelled ConfigMaps.
#
# Cluster context: DOKS - managed control plane (no kube-scheduler /
# controller-manager / etcd endpoints), Cilium instead of kube-proxy,
# 2 x s-2vcpu-4gb nodes (about 2.9 GiB allocatable each), do-block-storage volumes.
# ---------------------------------------------------------------------------

# Sidecar label for the dashboards in files/dashboards/; the sub-directory is
# the Grafana folder (auth-stack: the application and its load test, platform:
# the cluster and the infrastructure apps). label/labelValue must match
# kube-prometheus-stack.grafana.sidecar.dashboards.
dashboards:
  label: grafana_dashboard
  labelValue: "1"

kube-prometheus-stack:
  # `monitoring-prometheus` instead of `monitoring-kube-prometheus-stack-...`:
  # the operator's StatefulSet names would otherwise eat the 63-char budget.
  cleanPrometheusOperatorObjectNames: true

  # The CRDs come from charts/monitoring-crds (argocd/infra-monitoring-crds.yaml,
  # wave -3), pinned to the same operator release - validate.yml checks that.
  crds:
    enabled: false

  # -------------------------------------------------------------------------
  # Scrape targets
  # -------------------------------------------------------------------------
  # kubelet/cAdvisor is the source of the per-pod CPU and memory series;
  # kube-state-metrics adds the object state around them (requests, limits,
  # restarts, HPA, ResourceQuota), node-exporter the nodes themselves.
  kubelet:
    enabled: true
  kubeApiServer:
    enabled: true
  coreDns:
    enabled: true
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

  # Not reachable on DOKS: the control plane runs outside the cluster and
  # Cilium replaces kube-proxy. Left enabled they produce permanently down
  # targets and *Down alerts that nobody can act on.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  defaultRules:
    create: true
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      windows: false
      # The API-server SLO machinery (burn rates over up to three days of the
      # request-duration histogram) is the most expensive rule set in the chart,
      # and DigitalOcean operates that API server - nothing here can act on it.
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverSlos: false
    disabled:
      # Both assume N-1 node tolerance and fire as soon as requests exceed one
      # node - on a two-node pool that is permanent. The autoscaler replaces a
      # lost node; capacity lives on the "Platform - cluster capacity" dashboard
      # and in PodUnschedulable (additionalPrometheusRulesMap below).
      KubeCPUOvercommit: true
      KubeMemoryOvercommit: true

  # -------------------------------------------------------------------------
  # Operator
  # -------------------------------------------------------------------------
  prometheusOperator:
    admissionWebhooks:
      # cert-manager is already in the cluster (argocd/infra-cert-manager.yaml):
      # it issues the webhook certificate and injects the CA, so the chart does
      # not have to run a certgen Job from a third-party image.
      certManager:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # The config-reloader sidecar of Prometheus and Alertmanager (unbounded
    # unless set here).
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

  # -------------------------------------------------------------------------
  # Prometheus
  # -------------------------------------------------------------------------
  prometheus:
    prometheusSpec:
      scrapeInterval: 30s
      evaluationInterval: 30s
      retention: 7d
      retentionSize: 8GiB # of a 10Gi volume - WAL and compaction need headroom
      externalLabels:
        cluster: doks-vsc
      # No public endpoint: the UI is port-forward only, and this is the URL
      # the notifications link back to.
      externalUrl: http://localhost:9090

      # Accepts pushed samples on /api/v1/write: the k6 runner (loadtest/)
      # streams its client-side metrics here during a load test (Aufgabe 2, Chaos Testing).
      # The receiver only ingests; it does not add scrape targets.
      enableRemoteWriteReceiver: true

      # Nil selectors mean "only what this release rendered". The environments
      # (charts/auth-stack/templates/podmonitor.yaml, one per component) and the
      # platform apps (ArgoCD, Traefik, cert-manager, Kyverno: their charts'
      # own ServiceMonitors) ship their monitors themselves, so discovery is
      # opened up - but only to the namespaces this platform owns.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: &monitoredNamespaces
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - monitoring
              - auth-staging
              - auth-prod
              - argocd
              - traefik
              - cert-manager
              - policy
      podMonitorNamespaceSelector: *monitoredNamespaces
      ruleNamespaceSelector: *monitoredNamespaces

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: do-block-storage
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi

      # The request covers the working set of this cluster's head (tens of
      # thousands of series), so Prometheus is not the first pod evicted under
      # node pressure; the limit leaves room for WAL replay, compaction and a
      # load test's remote-write burst.
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi

  # -------------------------------------------------------------------------
  # Alertmanager
  # -------------------------------------------------------------------------
  # The notification channel is a webhook URL that never enters git: the Secret
  # `alertmanager-webhook` is created out-of-band (bootstrap/README.md step 2),
  # mounted under /etc/alertmanager/secrets/ and read through `url_file`.
  # For a Slack channel, swap `webhook_configs` for `slack_configs` with
  # `api_url_file` pointing at the same path.
  alertmanager:
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: [namespace, alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: webhook
        routes:
          # The stack's heartbeat and the info-alert inhibitor: both fire
          # permanently by design, neither is a notification.
          - receiver: "null"
            matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
          # The environments' alerts (charts/auth-stack PrometheusRule: the
          # backend, the frontend, the module service and the components'
          # health checks): grouped per environment and severity, repeated
          # hourly while firing.
          - receiver: webhook
            matchers:
              - service =~ "user-mgmt-service|auth-portal|module-service|auth-stack"
            group_by: [namespace, alertname, severity]
            group_wait: 30s
            repeat_interval: 1h
      receivers:
        - name: "null"
        - name: webhook
          webhook_configs:
            - url_file: /etc/alertmanager/secrets/alertmanager-webhook/webhook-url
              send_resolved: true
              max_alerts: 20
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity =~ warning|info
          equal: [namespace, alertname]
        - source_matchers:
            - severity = warning
          target_matchers:
            - severity = info
          equal: [namespace, alertname]
        - source_matchers:
            - alertname = InfoInhibitor
          target_matchers:
            - severity = info
          equal: [namespace]
        - target_matchers:
            - alertname = InfoInhibitor

    alertmanagerSpec:
      # Mounted at /etc/alertmanager/secrets/alertmanager-webhook/; without the
      # Secret the pod does not start - the channel is not optional.
      secrets:
        - alertmanager-webhook
      externalUrl: http://localhost:9093
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: do-block-storage
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

  # -------------------------------------------------------------------------
  # Grafana
  # -------------------------------------------------------------------------
  grafana:
    enabled: true
    # Admin credentials are created out-of-band, like every other secret
    # (bootstrap/README.md step 2).
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # No PVC on purpose: datasource, folders and dashboards are provisioned
    # from git, so a rescheduled Grafana comes back identical.
    persistence:
      enabled: false
    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: Europe/Zurich
    sidecar:
      # Both sidecars (dashboards, datasources) - unbounded unless set here.
      # Python processes that burst while they file the dashboard ConfigMaps;
      # a 100m limit throttles every burst and delays the reload.
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 192Mi
      dashboards:
        enabled: true
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
    grafana.ini:
      analytics:
        reporting_enabled: false
        check_for_updates: false
      # Reached through `kubectl port-forward` only (no public endpoint).
      server:
        root_url: http://localhost:3000/
      plugins:
        # Grafana 13 ships the Prometheus datasource as a bundled plugin and
        # would update it from grafana.com at start; on the read-only image
        # filesystem that update kills the plugin. Nothing is installed at start.
        preinstall_disabled: true
    testFramework:
      enabled: false
    # Grafana 13 holds ~430Mi resident for the ~40 provisioned dashboards (the
    # chart's set plus files/dashboards/) and runs every bundled datasource
    # plugin as its own process; below ~1Gi the container thrashes on page cache.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  kube-state-metrics:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 192Mi

  prometheus-node-exporter:
    # Each scrape runs the collectors in parallel; a 100m limit throttles a third
    # of all CPU periods (CPUThrottlingHigh) for milliseconds of real work.
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 64Mi

  # -------------------------------------------------------------------------
  # Platform alerts (PrometheusRule monitoring-kube-prometheus-platform)
  # -------------------------------------------------------------------------
  # What counts as broken for the cluster and the infrastructure apps; the
  # environments carry their own rules (charts/auth-stack). Delivered through
  # the default route above.
  additionalPrometheusRulesMap:
    platform:
      groups:
        - name: platform-capacity
          rules:
            - alert: ContainerOOMKilled
              expr: >-
                increase(kube_pod_container_status_restarts_total[15m]) > 0
                and on (namespace, pod, container)
                kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM-killed"
                description: >-
                  The container restarted after exceeding its memory limit.
                  Raise the limit where the workload is sized (charts/auth-stack
                  values, charts/monitoring/values.yaml, argocd/infra-*.yaml or
                  bootstrap/argocd-values.yaml) - or find the leak.
            - alert: PodUnschedulable
              expr: sum by (namespace, pod) (kube_pod_status_unschedulable) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.namespace }}/{{ $labels.pod }} has no node to run on"
                description: >-
                  No node has had room for the pod's requests for 10 minutes.
                  The autoscaler adds nodes up to max_nodes (terraform/variables.tf);
                  if it is at the limit the platform has outgrown the pool - see
                  the "Platform - cluster capacity" dashboard.
        - name: platform-edge
          rules:
            - alert: TraefikDown
              expr: >-
                sum(up{job="traefik"}) == 0
                or absent(up{job="traefik"})
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: no Traefik pod answers the metrics scrape
                description: >-
                  The ingress controller is down or no longer scraped: every
                  environment's host is unreachable. kubectl -n traefik get pods.
            - alert: TraefikHighServerErrorRate
              expr: >-
                100 * sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
                / sum by (service) (rate(traefik_service_requests_total[5m])) > 5
                and sum by (service) (rate(traefik_service_requests_total[5m])) > 0.1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.service }} answers {{ $value | printf \"%.1f\" }} % of requests with 5xx (seen at the edge)"
                description: >-
                  The edge sees what the frontend and its /api proxy return. If
                  the user-mgmt-service dashboard shows a clean backend, the
                  frontend pods or the proxy path are failing.
            - alert: CertManagerDown
              expr: >-
                sum(up{job="cert-manager"}) == 0
                or absent(up{job="cert-manager"})
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: cert-manager is down or no longer scraped
                description: >-
                  No certificate is renewed while it is down; issued certificates
                  stay valid until they expire (CertManagerCertificateExpiringSoon).
                  kubectl -n cert-manager get pods.
            - alert: CertManagerCertificateNotReady
              expr: certmanager_certificate_ready_status{condition="True"} == 0
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
                description: >-
                  kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}:
                  usually the HTTP-01 challenge is not reachable through the ingress
                  (host, DNS, NetworkPolicy) or the ACME account is rate-limited.
            - alert: CertManagerCertificateExpiringSoon
              expr: ((certmanager_certificate_expiration_timestamp_seconds > 0) - time()) / 86400 < 14
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | printf \"%.0f\" }} days"
                description: >-
                  cert-manager renews 30 days before expiry; this close to it the
                  renewal has been failing - see CertManagerCertificateNotReady
                  and the Certificate's conditions.
            - alert: CertManagerAcmeRateLimited
              expr: sum by (host) (increase(certmanager_http_acme_client_request_count{status="429"}[10m])) > 0
              labels:
                severity: warning
              annotations:
                summary: "the ACME server {{ $labels.host }} is rate-limiting this cluster"
                description: >-
                  Let's Encrypt answered 429. The staging limits are generous, so
                  this is usually a challenge loop - stop it before the account
                  is locked out for a week.
        - name: platform-gitops
          rules:
            - alert: ArgoCDDown
              expr: >-
                sum(up{job="argocd-application-controller-metrics"}) == 0
                or absent(up{job="argocd-application-controller-metrics"})
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: the ArgoCD application controller is down or no longer scraped
                description: >-
                  Nothing reconciles: merged changes stay undeployed until it is
                  back. kubectl -n argocd get pods.
            - alert: ArgoCDAppSyncFailed
              expr: sum by (name, project, phase) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m])) > 0
              labels:
                severity: warning
              annotations:
                summary: "ArgoCD application {{ $labels.name }} ended a sync in {{ $labels.phase }}"
                description: >-
                  The operation's message is in the ArgoCD UI (bootstrap/README.md
                  step 5) or `argocd app get {{ $labels.name }}`. Auto-sync does not
                  retry a revision that failed - fix forward with a new commit.
            - alert: ArgoCDAppOutOfSync
              expr: argocd_app_info{sync_status="OutOfSync"} == 1
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "ArgoCD application {{ $labels.name }} has been OutOfSync for 30 minutes"
                description: >-
                  Every Application auto-syncs (argocd/sync-defaults.patch), so a
                  lasting OutOfSync means the sync fails or is blocked - see
                  ArgoCDAppSyncFailed and the application's operation state.
            - alert: ArgoCDAppUnhealthy
              expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "ArgoCD application {{ $labels.name }} is {{ $labels.health_status }}"
                description: >-
                  A resource of the application is failing (Degraded), was never
                  created (Missing) or cannot be assessed (Unknown) for 15 minutes.
            - alert: ArgoCDClusterDisconnected
              expr: argocd_cluster_connection_status == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: ArgoCD lost its connection to the cluster API
                description: >-
                  The application controller cannot reach {{ $labels.server }};
                  no Application is reconciled until the connection is back.
