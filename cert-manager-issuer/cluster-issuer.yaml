# Let's Encrypt production ClusterIssuer, ACME HTTP-01 via the cluster-wide
# Traefik ingress controller (argocd/infra-traefik.yaml). Works for the
# nip.io hosts because they resolve publicly to the Traefik LoadBalancer IP,
# so Let's Encrypt's validation server can reach the HTTP-01 challenge path
# on port 80 (entryPoint `web` has allowACMEByPass: true precisely so the
# http->https redirect doesn't swallow the challenge request).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: samuel.ramseier@edu.teko.ch
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
